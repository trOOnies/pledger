{% macro side(name, label, fixed, options, special) %}
<label><span>{{ label }}{% if special %} <em class="optional">({{ special | lower }} account)</em>{% endif %}</span>
  {% if fixed %}
  <input value="{{ fixed }}" readonly tabindex="-1" class="fixed">
  <input type="hidden" name="{{ name }}" value="{{ fixed }}">
  {% else %}
  <select name="{{ name }}" required>
    <option value="">Choose…</option>
    {% for acc in options %}
    <option {% if acc == values[name] %}selected{% endif %}>{{ acc }}</option>
    {% endfor %}
  </select>
  {% endif %}
</label>
{% endmacro %}
<div class="pair">
  {{ side("acc_debit", "Debit", fields.debit_fixed, fields.debit_options, fields.debit_special) }}
  {{ side("acc_credit", "Credit", fields.credit_fixed, fields.credit_options, fields.credit_special) }}
</div>
