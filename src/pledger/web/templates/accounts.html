{% extends "base.html" %}
{% block title %}Accounts · pledger{% endblock %}
{% block content %}
<form id="filters" class="filters" hx-get="/accounts" hx-target="#accounts-view" hx-push-url="true" hx-trigger="change">
  <label>Month
    <select name="month">
      <option value="">All time</option>
      {% for m in months %}<option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m }}</option>{% endfor %}
    </select>
  </label>
</form>

<div id="accounts-view" hx-get="/accounts" hx-include="#filters" hx-trigger="accounts-changed from:body">{% include "_accounts.html" %}</div>

<script>
  // Keep the grouping picked for the Assets & liabilities bars when the accounts re-render.
  let accountsGroup = "currency";
  document.addEventListener("change", (e) => {
    if (e.target.name === "accounts-group") accountsGroup = e.target.value;
  });
  document.addEventListener("htmx:afterSwap", () => {
    const radio = document.querySelector(`input[name="accounts-group"][value="${accountsGroup}"]`);
    if (radio) radio.checked = true;
  });
</script>
{% endblock %}
