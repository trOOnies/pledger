<form id="new-investment-form" class="stack" hx-post="/investments/new" hx-swap="outerHTML">
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  {% if success %}<p class="msg success">{{ success }}</p>{% endif %}
  <div class="pair">
    <label>Account
      <select name="account" required>
        {% for name in accounts %}<option {% if name == values.account %}selected{% endif %}>{{ name }}</option>{% endfor %}
      </select>
    </label>
    <label>Type
      <select name="investment_type" required>
        {% for t, label in types.items() %}
        <option value="{{ t.value }}" {% if t.value == values.investment_type %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>Name
    <input name="name" value="{{ values.name }}" required autocomplete="off" placeholder="e.g. SPY">
  </label>
  <div class="pair">
    <label><span>Initial amount <em class="optional">(optional)</em></span>
      <span class="money-input">
        <span class="prefix">{{ currency }}</span>
        <input name="amount" inputmode="decimal" value="{{ values.amount }}" placeholder="0.00" autocomplete="off" data-money>
      </span>
    </label>
    <label><span>Initial quantity <em class="optional">(optional)</em></span>
      <input name="quantity" inputmode="decimal" value="{{ values.quantity }}" placeholder="0" autocomplete="off">
    </label>
  </div>
  <p class="muted small">Added to <code>{{ path }}</code>. Leave the initial amount and quantity empty for one you
    are about to buy; set them for one already held when the account starts.</p>
  <button type="submit">Add investment</button>
</form>
