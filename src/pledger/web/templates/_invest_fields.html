{# The fields that depend on the investment base movement picked: see views.invest_fields. #}
{% include "_account_fields.html" %}
{% if investment %}
<label><span>Investment{% if investment == "optional" %} <em class="optional">(optional)</em>{% endif %}</span>
  {% if investments_by_account %}
  <select name="investment" {% if investment == "required" %}required{% endif %}>
    <option value="">{{ "Choose…" if investment == "required" else "-" }}</option>
    {% for account, names in investments_by_account.items() %}
    <optgroup label="{{ account }}">
      {% for n in names %}<option {% if n == values.investment %}selected{% endif %}>{{ n }}</option>{% endfor %}
    </optgroup>
    {% endfor %}
  </select>
  {% else %}
  <select name="investment" {% if investment == "required" %}required{% endif %} disabled><option value="">No investments yet</option></select>
  {% endif %}
  {% if investment == "required" %}<span class="hint">A new one? Add it in <strong>New investment</strong> first.</span>{% endif %}
</label>
{% endif %}
{% if quantity %}
<label><span>Quantity{% if quantity == "optional" %} <em class="optional">(optional)</em>{% endif %}</span>
  <input name="quantity" inputmode="decimal" value="{{ values.quantity }}" placeholder="0" autocomplete="off"
    {% if quantity == "required" %}required{% endif %}>
</label>
{% endif %}
