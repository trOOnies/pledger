{# The fields that depend on the investment base movement picked: see views.invest_fields. #}
{% include "_account_fields.html" %}
<label><span>Investment{% if investment == "optional" %} <em class="optional">(optional)</em>{% endif %}</span>
  <input name="investment" value="{{ values.investment }}" list="investment-names" autocomplete="off"
    {% if investment == "required" %}required{% endif %}>
  <datalist id="investment-names">{% for n in investment_names %}<option value="{{ n }}">{% endfor %}</datalist>
</label>
{% if quantity %}
<label><span>Quantity{% if quantity == "optional" %} <em class="optional">(optional)</em>{% endif %}</span>
  <input name="quantity" inputmode="decimal" value="{{ values.quantity }}" placeholder="0" autocomplete="off"
    {% if quantity == "required" %}required{% endif %}>
</label>
{% endif %}
{% if investment_types %}
<label><span>Type <em class="optional">(for a new investment)</em></span>
  <select name="investment_type">
    <option value="">Its current one</option>
    {% for t, label in investment_types.items() %}
    <option value="{{ t.value }}" {% if t.value == values.investment_type %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</label>
{% endif %}
