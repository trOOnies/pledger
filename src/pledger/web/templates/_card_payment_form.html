<form id="card-payment-form" class="stack" hx-post="/credit-cards/payments" hx-swap="outerHTML">
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  {% if success %}<p class="msg success">{{ success }}</p>{% endif %}
  {% if bases %}
  <label>Date
    <input type="date" name="move_date" value="{{ values.move_date }}" required data-future-warning>
    <span class="hint warn" hidden>⚠️ This date is in the future.</span>
  </label>
  <label>Base movement
    <select name="base_movement" hx-get="/form/accounts" hx-target="#card-account-fields" hx-swap="innerHTML">
      {% for name in bases %}<option value="{{ name }}" {% if name == base_movement %}selected{% endif %}>{{ name }} ({{ cards[name] }})</option>{% endfor %}
    </select>
  </label>
  <div id="card-account-fields">{% include "_account_fields.html" %}</div>
  <label>Amount
    <span class="money-input">
      <span class="prefix">{{ currency }}</span>
      <input name="amount" inputmode="decimal" min="0" value="{{ values.amount }}" placeholder="0.00" required autocomplete="off" data-money>
    </span>
  </label>
  <label><span>Comment <em class="optional">(optional)</em></span>
    <input name="comment" value="{{ values.comment }}" autocomplete="off">
  </label>
  <button type="submit">Add card payment</button>
  {% else %}
  <p class="muted">No card payment base movements yet: add a transfer debiting a credit card in the
    <a href="/results">Results</a> tab.</p>
  {% endif %}
</form>
