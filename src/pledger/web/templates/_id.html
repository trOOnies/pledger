{# The ID column of a table of movements, the same in every tab (see store.ID_COLUMN). #}
{% macro id_header() %}<th title="Given by pledger itself; it never changes">ID</th>{% endmacro %}

{% macro id_cell(id) %}
{% if id %}
<td class="nowrap muted small" data-sort="{{ id }}">{{ id }}</td>
{% else %}
<td class="muted small" title="Added to the CSV while pledger runs: it gets its ID when pledger restarts or adds a movement to that CSV">-</td>
{% endif %}
{% endmacro %}
