<form id="movement-form" class="stack" hx-post="/movements" hx-swap="outerHTML">
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  {% if success %}<p class="msg success">{{ success }}</p>{% endif %}
  <label>Date
    <input type="date" name="move_date" value="{{ values.move_date }}" required>
  </label>
  <label>Base movement
    <select name="base_movement" hx-get="/form/accounts" hx-target="#account-fields">
      {% for type, names in bases_by_type.items() if names %}
      <optgroup label="{{ type | capitalize }}">
        {% for name in names %}
        <option {% if name == values.base_movement %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>
  </label>
  <div id="account-fields">{% include "_account_fields.html" %}</div>
  <label>Amount
    <input name="amount" inputmode="decimal" value="{{ values.amount }}" placeholder="0.00" required autocomplete="off">
  </label>
  <label>Comment
    <input name="comment" value="{{ values.comment }}" autocomplete="off">
  </label>
  <button type="submit">Add movement</button>
</form>
