<form id="movement-form" class="stack" hx-post="/movements" hx-swap="outerHTML">
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  {% if success %}<p class="msg success">{{ success }}</p>{% endif %}
  <label>Date
    <input type="date" name="move_date" value="{{ values.move_date }}" required>
  </label>
  <label>Type
    <select name="move_type" hx-get="/form/bases" hx-target="#base-fields" hx-swap="innerHTML">
      {% for type in move_types %}
      <option value="{{ type }}" {% if type == move_type %}selected{% endif %}>{{ type | capitalize }}</option>
      {% endfor %}
    </select>
  </label>
  <div id="base-fields" class="stack">{% include "_base_fields.html" %}</div>
  <label>Amount
    <span class="money-input">
      <span class="prefix">{{ currency }}</span>
      <input name="amount" inputmode="decimal" value="{{ values.amount }}" placeholder="0.00" required autocomplete="off" data-money>
    </span>
  </label>
  <label><span>Comment <em class="optional">(optional)</em></span>
    <input name="comment" value="{{ values.comment }}" autocomplete="off">
  </label>
  <button type="submit">Add movement</button>
</form>
