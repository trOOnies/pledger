{# The investment base movements of the movement type picked, and the fields of the selected one. #}
<label>Base movement
  {% if bases %}
  <select name="base_movement" hx-get="/form/invest-fields" hx-target="#invest-fields" hx-swap="innerHTML">
    {% for name in bases %}<option {% if name == base_movement %}selected{% endif %}>{{ name }}</option>{% endfor %}
  </select>
  {% else %}
  <select name="base_movement" required disabled><option value="">No {{ move_type }} investment base movements</option></select>
  {% endif %}
</label>
{# Reloaded when an investment is added, to pick it #}
<div id="invest-fields" class="stack" hx-get="/form/invest-fields" hx-trigger="investment-added from:body"
  hx-include="#invest-form [name=base_movement]">{% include "_invest_fields.html" %}</div>
