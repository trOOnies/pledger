<label>Base movement
  {% if bases %}
  <select name="base_movement" hx-get="/form/accounts" hx-target="#account-fields" hx-swap="innerHTML">
    {% if base_groups %}
    {# The base movements by result type, each group sorted alphabetically (see bases_by_group) #}
    {% for group, names in base_groups.items() %}
    <optgroup label="{{ group }}">
      {% for name in names %}<option {% if name == base_movement %}selected{% endif %}>{{ name }}</option>{% endfor %}
    </optgroup>
    {% endfor %}
    {% else %}
    {% for name in bases %}
    <option {% if name == base_movement %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
    {% endif %}
  </select>
  {% else %}
  <select name="base_movement" required disabled><option value="">No {{ move_type }} base movements</option></select>
  {% endif %}
</label>
<div id="account-fields">{% include "_account_fields.html" %}</div>
