<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pledger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ static_version('style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}?v={{ static_version('htmx.min.js') }}" defer></script>
  <script>
    // Apply the hidden amounts setting before the first paint, so amounts never flash.
    try {
      if (localStorage.getItem("pledger-hide-money") === "true") document.documentElement.classList.add("hide-money");
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">pledger</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Ledger</a>
      <a href="/accounts" {% if request.url.path == '/accounts' %}aria-current="page"{% endif %}>Accounts</a>
      <a href="/investments" {% if request.url.path == '/investments' %}aria-current="page"{% endif %}>Investments</a>
      <a href="/debt" {% if request.url.path == '/debt' %}aria-current="page"{% endif %}>Debt</a>
      <a href="/work" {% if request.url.path == '/work' %}aria-current="page"{% endif %}>Work</a>
      <a href="/charts" {% if request.url.path == '/charts' %}aria-current="page"{% endif %}>Charts</a>
      <a href="/setup" {% if request.url.path == '/setup' %}aria-current="page"{% endif %}>Setup</a>
      <a href="/help" {% if request.url.path == '/help' %}aria-current="page"{% endif %}>Help</a>
      <a href="/docs">API</a>
    </nav>
    <button type="button" id="visibility" class="visibility" aria-pressed="false" aria-label="Hide amounts" title="Hide amounts">
      <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </header>
  <div id="flash" class="flash" role="alert" hidden></div>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p>&copy; 2026 Pledger by trOOnies</p>
    <p>Made with Claude Code</p>
  </footer>
  <script>
    // Visibility toggle: replace every amount (elements marked .money) with the same
    // fixed mask, keeping the real text aside until amounts are shown again.
    const MONEY_MASK = "******";
    const visibility = document.getElementById("visibility");
    const moneyHidden = () => document.documentElement.classList.contains("hide-money");

    function setMoney(el, text) {
      if (moneyHidden()) {
        el.dataset.value = text;
        el.textContent = MONEY_MASK;
        el.dataset.masked = "";
      } else {
        el.textContent = text;
      }
    }

    function maskMoney(root) {
      root.querySelectorAll(".money:not([data-masked])").forEach((el) => setMoney(el, el.textContent));
    }

    function unmaskMoney(root) {
      root.querySelectorAll(".money[data-masked]").forEach((el) => {
        el.textContent = el.dataset.value;
        delete el.dataset.value;
        delete el.dataset.masked;
      });
    }

    function showVisibility() {
      const hidden = moneyHidden();
      const label = hidden ? "Show amounts" : "Hide amounts";
      visibility.setAttribute("aria-pressed", String(hidden));
      visibility.setAttribute("aria-label", label);
      visibility.title = label;
    }
    visibility.addEventListener("click", () => {
      const hidden = document.documentElement.classList.toggle("hide-money");
      try { localStorage.setItem("pledger-hide-money", String(hidden)); } catch {}
      if (hidden) maskMoney(document); else unmaskMoney(document);
      showVisibility();
    });
    if (moneyHidden()) maskMoney(document);
    showVisibility();
    document.addEventListener("htmx:afterSwap", () => { if (moneyHidden()) maskMoney(document); });
    // Confirmation questions mentioning an amount (data-confirm-money) mask it too.
    document.addEventListener("htmx:confirm", (e) => {
      const amount = e.detail.elt.dataset.confirmMoney;
      if (!moneyHidden() || !amount || !e.detail.question) return;
      e.preventDefault();
      if (window.confirm(e.detail.question.replace(amount, MONEY_MASK))) e.detail.issueRequest(true);
    });

    // Show server errors (e.g. a stale delete) instead of failing silently.
    document.addEventListener("htmx:responseError", (e) => {
      const flash = document.getElementById("flash");
      let msg = e.detail.xhr.statusText || "Request failed";
      try { msg = JSON.parse(e.detail.xhr.responseText).detail || msg; } catch {}
      flash.textContent = msg;
      flash.hidden = false;
      setTimeout(() => { flash.hidden = true; }, 6000);
    });
    // Sortable tables: click (or Enter on) a header to sort by that column; click
    // again to reverse. The order is kept when HTMX re-renders the table.
    const sortState = {};

    function sortTable(table) {
      const state = sortState[table.dataset.sortable];
      const tbody = table.tBodies[0];
      if (!state || !tbody || tbody.rows.length < 2) return;
      const value = (row) => {
        const cell = row.cells[state.col];
        return cell ? (cell.dataset.sort ?? cell.textContent.trim()) : "";
      };
      const rows = [...tbody.rows].sort((a, b) => {
        const [x, y] = [value(a), value(b)];
        const [nx, ny] = [Number(x), Number(y)];
        const cmp = x !== "" && y !== "" && !isNaN(nx) && !isNaN(ny)
          ? nx - ny
          : x.localeCompare(y, undefined, { numeric: true, sensitivity: "base" });
        return state.dir * cmp;
      });
      tbody.append(...rows);
      table.querySelectorAll("thead th").forEach((th, i) => {
        if (i === state.col) th.setAttribute("aria-sort", state.dir > 0 ? "ascending" : "descending");
        else th.removeAttribute("aria-sort");
      });
    }

    function initSortable(root) {
      root.querySelectorAll("table[data-sortable]").forEach((table) => {
        table.querySelectorAll("thead th").forEach((th) => {
          if (th.textContent.trim()) th.tabIndex = 0;
        });
        sortTable(table);
      });
    }

    function onSortHeader(e) {
      const th = e.target.closest("table[data-sortable] thead th");
      if (!th || !th.textContent.trim()) return;
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      const table = th.closest("table");
      const key = table.dataset.sortable;
      const prev = sortState[key];
      sortState[key] = { col: th.cellIndex, dir: prev && prev.col === th.cellIndex ? -prev.dir : 1 };
      sortTable(table);
    }

    document.addEventListener("click", onSortHeader);
    document.addEventListener("keydown", onSortHeader);
    document.addEventListener("DOMContentLoaded", () => initSortable(document));
    document.addEventListener("htmx:afterSettle", (e) => initSortable(e.detail.elt));

    // Warn (without blocking) when a movement is dated after today.
    function checkFutureDates(root) {
      const today = new Date().toLocaleDateString("en-CA");  // YYYY-MM-DD, local time
      root.querySelectorAll("input[data-future-warning]").forEach((input) => {
        const hint = input.parentElement.querySelector(".hint.warn");
        if (hint) hint.hidden = !(input.value && input.value > today);
      });
    }
    document.addEventListener("input", (e) => {
      if (e.target.matches("input[data-future-warning]")) checkFutureDates(e.target.parentElement);
    });
    document.addEventListener("DOMContentLoaded", () => checkFutureDates(document));
    document.addEventListener("htmx:afterSettle", (e) => checkFutureDates(e.detail.elt));

    // Money inputs always show two decimals, e.g. 1234.5 -> 1,234.50.
    document.addEventListener("change", (e) => {
      const input = e.target;
      if (!input.matches("input[data-money]") || !input.value.trim()) return;
      const value = Number(input.value.replace(/,/g, ""));
      if (Number.isFinite(value)) {
        input.value = value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
    });
  </script>
</body>
</html>
