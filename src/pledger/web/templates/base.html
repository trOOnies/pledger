<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pledger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">pledger</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Ledger</a>
      <a href="/accounts" {% if request.url.path == '/accounts' %}aria-current="page"{% endif %}>Accounts</a>
      <a href="/charts" {% if request.url.path == '/charts' %}aria-current="page"{% endif %}>Charts</a>
      <a href="/setup" {% if request.url.path == '/setup' %}aria-current="page"{% endif %}>Setup</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <div id="flash" class="flash" role="alert" hidden></div>
  <main>{% block content %}{% endblock %}</main>
  <script>
    // Show server errors (e.g. a stale delete) instead of failing silently.
    document.addEventListener("htmx:responseError", (e) => {
      const flash = document.getElementById("flash");
      let msg = e.detail.xhr.statusText || "Request failed";
      try { msg = JSON.parse(e.detail.xhr.responseText).detail || msg; } catch {}
      flash.textContent = msg;
      flash.hidden = false;
      setTimeout(() => { flash.hidden = true; }, 6000);
    });
    // Sortable tables: click (or Enter on) a header to sort by that column; click
    // again to reverse. The order is kept when HTMX re-renders the table.
    const sortState = {};

    function sortTable(table) {
      const state = sortState[table.dataset.sortable];
      const tbody = table.tBodies[0];
      if (!state || !tbody || tbody.rows.length < 2) return;
      const value = (row) => {
        const cell = row.cells[state.col];
        return cell ? (cell.dataset.sort ?? cell.textContent.trim()) : "";
      };
      const rows = [...tbody.rows].sort((a, b) => {
        const [x, y] = [value(a), value(b)];
        const [nx, ny] = [Number(x), Number(y)];
        const cmp = x !== "" && y !== "" && !isNaN(nx) && !isNaN(ny)
          ? nx - ny
          : x.localeCompare(y, undefined, { numeric: true, sensitivity: "base" });
        return state.dir * cmp;
      });
      tbody.append(...rows);
      table.querySelectorAll("thead th").forEach((th, i) => {
        if (i === state.col) th.setAttribute("aria-sort", state.dir > 0 ? "ascending" : "descending");
        else th.removeAttribute("aria-sort");
      });
    }

    function initSortable(root) {
      root.querySelectorAll("table[data-sortable]").forEach((table) => {
        table.querySelectorAll("thead th").forEach((th) => {
          if (th.textContent.trim()) th.tabIndex = 0;
        });
        sortTable(table);
      });
    }

    function onSortHeader(e) {
      const th = e.target.closest("table[data-sortable] thead th");
      if (!th || !th.textContent.trim()) return;
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      const table = th.closest("table");
      const key = table.dataset.sortable;
      const prev = sortState[key];
      sortState[key] = { col: th.cellIndex, dir: prev && prev.col === th.cellIndex ? -prev.dir : 1 };
      sortTable(table);
    }

    document.addEventListener("click", onSortHeader);
    document.addEventListener("keydown", onSortHeader);
    document.addEventListener("DOMContentLoaded", () => initSortable(document));
    document.addEventListener("htmx:afterSettle", (e) => initSortable(e.detail.elt));

    // Money inputs always show two decimals, e.g. 1234.5 -> 1,234.50.
    document.addEventListener("change", (e) => {
      const input = e.target;
      if (!input.matches("input[data-money]") || !input.value.trim()) return;
      const value = Number(input.value.replace(/,/g, ""));
      if (Number.isFinite(value)) {
        input.value = value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
    });
  </script>
</body>
</html>
