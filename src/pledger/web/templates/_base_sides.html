{% macro side(name, label, fixed) %}
<label><span>{{ label }}{% if not fixed %} <em class="optional">(optional)</em>{% endif %}</span>
  {% if fixed %}
  <input value="{{ fixed }}" readonly tabindex="-1" class="fixed">
  {% else %}
  <select name="{{ name }}">
    <option value="">Any</option>
    {% for acc in sides.free %}
    <option {% if acc == values[name] %}selected{% endif %}>{{ acc }}</option>
    {% endfor %}
  </select>
  {% endif %}
</label>
{% endmacro %}
{% if sides.result_types %}
<label>Result type
  <select name="result_type">
    {% for rt in sides.result_types %}
    <option value="{{ rt.name }}" {% if rt.name == values.result_type %}selected{% endif %}>{{ rt.long_name }}</option>
    {% endfor %}
  </select>
</label>
{% endif %}
<div class="pair">
  {{ side("debit", "Debit", sides.debit_fixed) }}
  {{ side("credit", "Credit", sides.credit_fixed) }}
</div>
